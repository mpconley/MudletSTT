name: Run busted specs

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3.3.0

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      # Runs first: the scripts run inside Mudlet, so a call to something that
      # does not exist is only found when that line executes, which for this
      # package means in the middle of a live microphone test
      - name: Check for undefined variables
        run: luacheck src spec tools

      - name: Run specs
        run: busted spec
